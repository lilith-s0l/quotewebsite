<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save Your Quotes</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="/app.js"></script>
</head>
  
  
<body>
  <main class="layout">
    
    <section class="panel" aria-labelledby="form-heading">
      <h1 id="form-heading">Save Your Quotes</h1>
      <p class="subtext">A saying stuck to mind? Write it down below!</p>
      
      <form id="resume-form" novalidate>
        
        <div class="field">
          <label for="quote"></label>
          <textarea id="quote" name="quote" rows="6" required maxlength="1000" aria-describedby="quote-error" placeholder="Include your quote here."></textarea>
          <span class="error" id="quote-error"></span>
        </div>

        <div class="field">
          <label for="author">Author of Quote</label>
          <input id="author" name="author" type="text" maxlength="100" aria-describedby="author-error">
          <span class="error" id="author-error"></span>
        </div>

        <!-- DATA OMITTED DUE TO PEER FEEDBACK -->
        <!-- <div class="years">
          <label for="date">Date Created <span class="optional">(optional)</span></label>
          <input id="date" name="date" type="text" required maxlength="100" aria-describedby="start-year-error">
          <span class="error" id="start-year-error"></span>
        </div> -->

        <!-- <div class="years">
          <label for="genre">Genre <span class="optional">(optional)</span></label>
          <input id="genre" name="genre" type="text" required maxlength="100" aria-describedby="employer-error" placeholder="Example: Inspiring, soothing, somber">
          <span class="error" id="employer-error"></span>
        </div> -->

        
        <div class="form-actions">
          <button type="submit">Save Quote</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>Cancel edit</button>
        </div>
        
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    
    
    <section class="resume" aria-labelledby="resume-heading">
      
      <header class="resume-header">
        <h2 id="resume-heading">Your Saved Quotes</h2>
        <p class="headerPeriod">. . .</p>
      </header>
      
      <div id="resume-status" role="status" aria-live="polite">Your quotes are loading…</div>
      <div id="resume-items"></div>
    </section>
    
    
  </main>
  
  <template id="resume-item-template">
    <article class="experience">
      <div class="experience-heading"><h3 class="job-title"></h3><p class="dates"></p></div>
      <p class="quote"></p>
      <p class="accomplishment"></p>
      <p class="employer"></p>
      <div class="item-actions">
        <button class="edit-item secondary" type="button">Edit</button>
        <button class="delete-item secondary" type="button">Delete</button>
      </div>
    </article>
  </template>
  
  
</body>
  
  
</html>
